<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CinemaHub</title>

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fascinate&family=Luckiest+Guy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="responsive.css">
</head>

<body>

    <div class="header">
        <nav>
            <h1 class="fascinate-regular">📽️CinemaHub</h1>

            <input type="search" placeholder="Search movies..." id="searchInput">

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="trailers.html">Trailers</a></li>
                <li><a href="movies.html">Movies</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </div>

    <div class="container">

        <div class="login-page">
            <h1>Login</h1>
        </div>

        <input type="text" placeholder="Enter Username">

        <input type="password" placeholder="Enter Password">

        <div class="forgot-password">
            <a href="#">Forgot Password?</a>
        </div>

        <button class="login-btn">Login</button>

        <div class="divide">
            <span>OR</span>
        </div>

        <div class="signup-button">
            <h3>
                Don't have an account?
                <a href="#">Sign Up</a>
            </h3>
        </div>

        <button class="google-btn">
            Continue with Google
        </button>

    </div>

    <footer>
        <p>&copy; 2026 CinemaHub | All Rights Reserved.</p>
    </footer>

</body>

</html>
